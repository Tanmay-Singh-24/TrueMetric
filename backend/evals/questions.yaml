# TrueMetric evaluation questions. Written before either configuration was run.
#
# category:        metric | freeform | ambiguous | refuse
# expected_metric: the metric the router should choose (metric questions only)
# reference:       a case label in tests/reference_values.json that --check-gold compares
#                  the gold result with
# gold_sql:        the correct answer, written independently of the metric templates.
#                  Each returns only the columns the question asks for; extra columns in a
#                  system's result are allowed by the scoring.

# ---------------------------------------------------------------- metric (20) ----

- id: m01
  category: metric
  question: How much did we sell in 2018?
  expected_metric: merchandise_revenue
  reference: merchandise_revenue / 2018
  gold_sql: |
    SELECT SUM(oi.price) AS revenue
    FROM order_items AS oi
    WHERE oi.order_id IN (
        SELECT o.order_id
        FROM orders AS o
        WHERE o.order_status NOT IN ('canceled', 'unavailable')
          AND o.order_purchase_timestamp >= '2018-01-01'
          AND o.order_purchase_timestamp < '2019-01-01'
    )

- id: m02
  category: metric
  question: How much revenue did customers in São Paulo state bring in during 2018?
  expected_metric: merchandise_revenue
  reference: merchandise_revenue / 2018, state SP
  gold_sql: |
    SELECT SUM(oi.price) AS revenue
    FROM customers AS c
    JOIN orders AS o ON o.customer_id = c.customer_id
    JOIN order_items AS oi ON oi.order_id = o.order_id
    WHERE c.customer_state = 'SP'
      AND o.order_status NOT IN ('canceled', 'unavailable')
      AND o.order_purchase_timestamp >= '2018-01-01'
      AND o.order_purchase_timestamp < '2019-01-01'

- id: m03
  category: metric
  question: How many orders were placed in 2017?
  expected_metric: order_count
  reference: order_count / 2017
  gold_sql: |
    SELECT COUNT(o.order_id) AS orders
    FROM orders AS o
    WHERE o.order_status NOT IN ('canceled', 'unavailable')
      AND o.order_purchase_timestamp >= '2017-01-01'
      AND o.order_purchase_timestamp < '2018-01-01'

- id: m04
  category: metric
  question: How many orders came from Rio de Janeiro state between March and June 2018?
  expected_metric: order_count
  gold_sql: |
    SELECT COUNT(*) AS orders
    FROM orders AS o
    WHERE o.order_status NOT IN ('canceled', 'unavailable')
      AND o.order_purchase_timestamp >= '2018-03-01'
      AND o.order_purchase_timestamp < '2018-07-01'
      AND o.customer_id IN (SELECT customer_id FROM customers WHERE customer_state = 'RJ')

- id: m05
  category: metric
  question: On average, how much did customers spend per order in 2018?
  expected_metric: average_order_value
  reference: average_order_value / 2018
  gold_sql: |
    SELECT ROUND(AVG(per_order.order_total), 2) AS average_order_value
    FROM (
        SELECT oi.order_id, SUM(oi.price) AS order_total
        FROM order_items AS oi
        JOIN orders AS o ON o.order_id = oi.order_id
        WHERE o.order_status NOT IN ('canceled', 'unavailable')
          AND o.order_purchase_timestamp >= '2018-01-01'
          AND o.order_purchase_timestamp < '2019-01-01'
        GROUP BY oi.order_id
    ) AS per_order

- id: m06
  category: metric
  question: What is the average order value for customers in Minas Gerais?
  expected_metric: average_order_value
  gold_sql: |
    SELECT ROUND(AVG(per_order.order_total), 2) AS average_order_value
    FROM (
        SELECT oi.order_id, SUM(oi.price) AS order_total
        FROM order_items AS oi
        JOIN orders AS o ON o.order_id = oi.order_id
        JOIN customers AS c ON c.customer_id = o.customer_id
        WHERE o.order_status NOT IN ('canceled', 'unavailable')
          AND c.customer_state = 'MG'
        GROUP BY oi.order_id
    ) AS per_order

- id: m07
  category: metric
  question: Show me the sales trend month by month for 2017.
  expected_metric: monthly_revenue
  reference: monthly_revenue / 2017
  gold_sql: |
    SELECT DATE_TRUNC('month', o.order_purchase_timestamp) AS month,
           SUM(oi.price) AS revenue
    FROM orders AS o
    JOIN order_items AS oi ON oi.order_id = o.order_id
    WHERE o.order_status NOT IN ('canceled', 'unavailable')
      AND o.order_purchase_timestamp >= '2017-01-01'
      AND o.order_purchase_timestamp < '2018-01-01'
    GROUP BY DATE_TRUNC('month', o.order_purchase_timestamp)
    ORDER BY month

- id: m08
  category: metric
  question: How did monthly revenue from watches and gifts develop in the first half of 2018?
  expected_metric: monthly_revenue
  gold_sql: |
    SELECT DATE_TRUNC('month', o.order_purchase_timestamp) AS month,
           SUM(oi.price) AS revenue
    FROM orders AS o
    JOIN order_items AS oi ON oi.order_id = o.order_id
    JOIN products AS p ON p.product_id = oi.product_id
    WHERE o.order_status NOT IN ('canceled', 'unavailable')
      AND p.category = 'watches_gifts'
      AND o.order_purchase_timestamp >= '2018-01-01'
      AND o.order_purchase_timestamp < '2018-07-01'
    GROUP BY DATE_TRUNC('month', o.order_purchase_timestamp)
    ORDER BY month

- id: m09
  category: metric
  question: Which 5 product categories brought in the most revenue?
  expected_metric: top_categories_by_revenue
  reference: top_categories_by_revenue / all data
  gold_sql: |
    SELECT p.category, SUM(oi.price) AS revenue
    FROM order_items AS oi
    JOIN products AS p ON p.product_id = oi.product_id
    WHERE oi.order_id IN (
        SELECT order_id FROM orders WHERE order_status NOT IN ('canceled', 'unavailable')
    )
    GROUP BY p.category
    ORDER BY revenue DESC, p.category
    LIMIT 5

- id: m10
  category: metric
  question: What were the top 3 categories by sales value for customers in Rio Grande do Sul in 2018?
  expected_metric: top_categories_by_revenue
  gold_sql: |
    SELECT p.category, SUM(oi.price) AS revenue
    FROM order_items AS oi
    JOIN products AS p ON p.product_id = oi.product_id
    JOIN orders AS o ON o.order_id = oi.order_id
    JOIN customers AS c ON c.customer_id = o.customer_id
    WHERE o.order_status NOT IN ('canceled', 'unavailable')
      AND c.customer_state = 'RS'
      AND o.order_purchase_timestamp >= '2018-01-01'
      AND o.order_purchase_timestamp < '2019-01-01'
    GROUP BY p.category
    ORDER BY revenue DESC, p.category
    LIMIT 3

- id: m11
  category: metric
  question: Which 5 categories sold the most items?
  expected_metric: top_categories_by_units
  reference: top_categories_by_units / all data
  gold_sql: |
    SELECT p.category, COUNT(*) AS units
    FROM order_items AS oi
    JOIN products AS p ON p.product_id = oi.product_id
    WHERE oi.order_id IN (
        SELECT order_id FROM orders WHERE order_status NOT IN ('canceled', 'unavailable')
    )
    GROUP BY p.category
    ORDER BY units DESC, p.category
