- id: m12
  category: metric
  question: List the 10 most popular categories by number of units sold in 2017.
  expected_metric: top_categories_by_units
  gold_sql: |
    SELECT p.category, COUNT(*) AS units
    FROM order_items AS oi
    JOIN products AS p ON p.product_id = oi.product_id
    JOIN orders AS o ON o.order_id = oi.order_id
    WHERE o.order_status NOT IN ('canceled', 'unavailable')
