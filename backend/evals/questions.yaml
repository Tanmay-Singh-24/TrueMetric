- id: m13
  category: metric
  question: Which five customer states bring in the most revenue?
  expected_metric: revenue_by_state
  reference: revenue_by_state / all data
  gold_sql: |
    SELECT c.customer_state AS state, SUM(oi.price) AS revenue
    FROM customers AS c
    JOIN orders AS o ON o.customer_id = c.customer_id
    JOIN order_items AS oi ON oi.order_id = o.order_id
    WHERE o.order_status NOT IN ('canceled', 'unavailable')
    GROUP BY c.customer_state
    ORDER BY revenue DESC, c.customer_state
    LIMIT 5

- id: m14
  category: metric
  question: What were the top 10 customer states by revenue in 2017?
  expected_metric: revenue_by_state
  gold_sql: |
    SELECT c.customer_state AS state, SUM(oi.price) AS revenue
    FROM customers AS c
    JOIN orders AS o ON o.customer_id = c.customer_id
    JOIN order_items AS oi ON oi.order_id = o.order_id
    WHERE o.order_status NOT IN ('canceled', 'unavailable')
      AND o.order_purchase_timestamp >= '2017-01-01'
      AND o.order_purchase_timestamp < '2018-01-01'
    GROUP BY c.customer_state
    ORDER BY revenue DESC, c.customer_state
    LIMIT 10

- id: m15
  category: metric
  question: What percentage of our customers placed more than one order?
  expected_metric: repeat_customer_rate
  reference: repeat_customer_rate / all data
  gold_sql: |
    SELECT ROUND(100.0 * SUM(CASE WHEN per_person.orders >= 2 THEN 1 ELSE 0 END)
                 / COUNT(*), 2) AS repeat_rate_pct
    FROM (
        SELECT c.customer_unique_id, COUNT(*) AS orders
        FROM orders AS o
        JOIN customers AS c ON c.customer_id = o.customer_id
        WHERE o.order_status NOT IN ('canceled', 'unavailable')
        GROUP BY c.customer_unique_id
    ) AS per_person

- id: m16
  category: metric
  question: What percentage of 2018 customers came back for another order that same year?
  expected_metric: repeat_customer_rate
  reference: repeat_customer_rate / 2018
  gold_sql: |
    SELECT ROUND(100.0 * SUM(CASE WHEN per_person.orders >= 2 THEN 1 ELSE 0 END)
                 / COUNT(*), 2) AS repeat_rate_pct
    FROM (
        SELECT c.customer_unique_id, COUNT(*) AS orders
        FROM orders AS o
        JOIN customers AS c ON c.customer_id = o.customer_id
        WHERE o.order_status NOT IN ('canceled', 'unavailable')
          AND o.order_purchase_timestamp >= '2018-01-01'
          AND o.order_purchase_timestamp < '2019-01-01'
        GROUP BY c.customer_unique_id
    ) AS per_person

- id: m17
  category: metric
  question: Of the orders placed in 2017 that were delivered, what percentage arrived late?
  expected_metric: late_delivery_rate
  reference: late_delivery_rate / 2017
  gold_sql: |
    SELECT ROUND(100.0 * AVG(
               CASE WHEN o.order_delivered_customer_date::date
                         > o.order_estimated_delivery_date::date THEN 1 ELSE 0 END
           ), 2) AS late_rate_pct
    FROM orders AS o
    WHERE o.order_status = 'delivered'
      AND o.order_delivered_customer_date IS NOT NULL
      AND o.order_purchase_timestamp >= '2017-01-01'
      AND o.order_purchase_timestamp < '2018-01-01'

- id: m18
  category: metric
  question: How often were deliveries to customers in Bahia late, as a percentage?
  expected_metric: late_delivery_rate
  gold_sql: |
    SELECT ROUND(100.0 * AVG(
               CASE WHEN o.order_delivered_customer_date::date
                         > o.order_estimated_delivery_date::date THEN 1 ELSE 0 END
           ), 2) AS late_rate_pct
    FROM orders AS o
    JOIN customers AS c ON c.customer_id = o.customer_id
    WHERE o.order_status = 'delivered'
      AND o.order_delivered_customer_date IS NOT NULL
      AND c.customer_state = 'BA'

- id: m19
  category: metric
  question: What is our average customer review score?
  expected_metric: average_review_score
  reference: average_review_score / all data
  gold_sql: |
    SELECT ROUND(AVG(review_score), 2) AS average_score
    FROM order_reviews

- id: m20
  category: metric
  question: How do customers rate orders that include health and beauty products, on average?
  expected_metric: average_review_score
  reference: average_review_score / all data, health_beauty
  gold_sql: |
    SELECT ROUND(AVG(r.review_score), 2) AS average_score
    FROM order_reviews AS r
    WHERE r.order_id IN (
        SELECT oi.order_id
        FROM order_items AS oi
        JOIN products AS p ON p.product_id = oi.product_id
        WHERE p.category = 'health_beauty'
    )

# -------------------------------------------------------------- freeform (8) ----
# f01-f03 tempt a join of order_items and order_payments, which multiplies payments.

- id: f01
  category: freeform
  question: For delivered orders that contain at least one bed_bath_table item, how much was paid in total with each payment type?
  gold_sql: |
    SELECT p.payment_type, SUM(p.payment_value) AS total_paid
    FROM order_payments AS p
    JOIN orders AS o ON o.order_id = p.order_id
    WHERE o.order_status = 'delivered'
      AND EXISTS (
          SELECT 1
          FROM order_items AS oi
          JOIN products AS pr ON pr.product_id = oi.product_id
          WHERE oi.order_id = p.order_id AND pr.category = 'bed_bath_table'
      )
    GROUP BY p.payment_type

- id: f02
  category: freeform
  question: What is the total payment value of delivered orders that have more than one item?
  gold_sql: |
    SELECT SUM(p.payment_value) AS total_paid
    FROM order_payments AS p
    JOIN orders AS o ON o.order_id = p.order_id
    WHERE o.order_status = 'delivered'
      AND p.order_id IN (
          SELECT order_id FROM order_items GROUP BY order_id HAVING COUNT(*) > 1
      )

- id: f03
  category: freeform
  question: What is the average total payment per delivered order, for orders that include a health_beauty item?
  gold_sql: |
    SELECT AVG(per_order.paid) AS average_paid
    FROM (
        SELECT p.order_id, SUM(p.payment_value) AS paid
        FROM order_payments AS p
        JOIN orders AS o ON o.order_id = p.order_id
        WHERE o.order_status = 'delivered'
          AND EXISTS (
              SELECT 1
              FROM order_items AS oi
              JOIN products AS pr ON pr.product_id = oi.product_id
              WHERE oi.order_id = p.order_id AND pr.category = 'health_beauty'
          )
        GROUP BY p.order_id
    ) AS per_order

- id: f04
  category: freeform
  question: How many sellers are there in each state?
  gold_sql: |
    SELECT seller_state, COUNT(*) AS sellers
    FROM sellers
    GROUP BY seller_state

- id: f05
  category: freeform
  question: Which payment type is used most often?
  gold_sql: |
    SELECT payment_type
    FROM order_payments
    GROUP BY payment_type
    ORDER BY COUNT(*) DESC
    LIMIT 1

- id: f06
  category: freeform
  question: For delivered orders placed in 2018, what is the average number of calendar days from purchase to delivery?
  gold_sql: |
    SELECT AVG(o.order_delivered_customer_date::date - o.order_purchase_timestamp::date)
           AS average_days
    FROM orders AS o
    WHERE o.order_status = 'delivered'
      AND o.order_delivered_customer_date IS NOT NULL
      AND o.order_purchase_timestamp >= '2018-01-01'
      AND o.order_purchase_timestamp < '2019-01-01'

- id: f07
  category: freeform
  question: Which 5 sellers had the highest item revenue in 2018, excluding canceled and unavailable orders? Show the seller id and the revenue.
  gold_sql: |
    SELECT oi.seller_id, SUM(oi.price) AS revenue
    FROM order_items AS oi
    JOIN orders AS o ON o.order_id = oi.order_id
    WHERE o.order_status NOT IN ('canceled', 'unavailable')
      AND o.order_purchase_timestamp >= '2018-01-01'
      AND o.order_purchase_timestamp < '2019-01-01'
    GROUP BY oi.seller_id
    ORDER BY revenue DESC
    LIMIT 5

- id: f08
  category: freeform
  question: Across all order items, whatever the order status, which 5 customer states have the highest average freight charge per item?
  gold_sql: |
    SELECT c.customer_state, AVG(oi.freight_value) AS average_freight
    FROM order_items AS oi
    JOIN orders AS o ON o.order_id = oi.order_id
    JOIN customers AS c ON c.customer_id = o.customer_id
    GROUP BY c.customer_state
    ORDER BY average_freight DESC
    LIMIT 5

