[project]
name = "orderlens"
version = "0.1.0"
description = "Plain-English questions over e-commerce orders, answered by verified metrics first."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.163.0",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.3",
    "sqlglot>=30.31.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs the database (DATABASE_URL)"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
